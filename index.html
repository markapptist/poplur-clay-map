<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable are NOT cosmetic here: without them, tapping
         the pop composer's message field permanently breaks the map's layout.
         iOS WebKit auto-zooms the page whenever a text field with a computed
         font-size UNDER 16px takes focus, and `.composeMessage` is a 10px
         textarea. WebKit does not undo that zoom on blur, so the whole UI stays
         scaled up with its right-hand side — "Post here", the radius total —
         clipped off the screen until the app is relaunched. Pinning the scale is
         the only lever that covers every such field at once, and it costs
         nothing the app wants: Mapbox drives pinch-zoom from its own touch
         handlers, not from page scale, so the map still zooms normally.
         WKWebView honours this because `ignoresViewportScaleLimits` is left at
         its default of false — if that is ever set true, this bug comes back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The base background of a document — what WebKit paints BEFORE any author
         CSS applies — is white unless the document declares a dark colour scheme.
         This meta is honoured while the head is still parsing, earlier than the
         inline style below and far earlier than the bundle's stylesheet, so it is
         the only lever that covers the very first paint. It matters most for this
         page as an IFRAME (the map embed): a subframe's base background paints
         ABOVE the iframe element's own background, so the parent cannot colour it. -->
    <meta name="color-scheme" content="dark" />
    <title>Poplur — Post-login</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { color-scheme: dark; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #050407; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
